<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>レンタルサロン yanagi｜予約カレンダー</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #f8f7f3;
  color: #333;
  font-family: Arial, sans-serif;
}

header {
  background: #506b59;
  color: white;
  text-align: center;
  padding: 28px 15px;
}

header h1 {
  margin: 0;
  font-size: 25px;
}

header p {
  margin-bottom: 0;
  font-size: 14px;
}

main {
  max-width: 650px;
  margin: 25px auto;
  padding: 25px;
  background: white;
  border-radius: 12px;
}

h2 {
  text-align: center;
  font-size: 22px;
}

.month-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 25px 0;
}

.month-nav button {
  background: none;
  border: none;
  color: #238bd0;
  font-size: 28px;
  cursor: pointer;
}

#monthTitle {
  font-size: 21px;
  font-weight: bold;
}

.calendar {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 5px;
  text-align: center;
}

.weekday {
  padding: 10px 0;
  font-weight: bold;
}

.weekday:first-child { color: red; }
.weekday:nth-child(7) { color: #238bd0; }

.day {
  min-height: 70px;
  padding: 8px 2px;
  border: 1px solid transparent;
  border-radius: 6px;
  cursor: pointer;
  background: white;
}

.day:hover {
  background: #eef6fc;
}

.day.selected {
  background: #dff0ff;
  border-color: #238bd0;
}

.day.disabled {
  color: #bbb;
  cursor: not-allowed;
}

.day .symbol {
  display: block;
  margin-top: 5px;
  font-size: 23px;
}

.available { color: #238bd0; }
.partial { color: #e5a100; }
.unavailable { color: #d9534f; }

.section {
  margin-top: 35px;
}

.section h3 {
  font-size: 17px;
}

.slots {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-top: 15px;
}

.slot {
  padding: 12px 3px;
  border: 1px solid #ccc;
  border-radius: 6px;
  background: white;
  cursor: pointer;
  font-size: 14px;
}

.slot.selected {
  background: #506b59;
  color: white;
}

.slot:disabled {
  background: #eee;
  color: #aaa;
  cursor: not-allowed;
}

select {
  width: 100%;
  padding: 13px;
  border: 1px solid #ccc;
  border-radius: 5px;
  font-size: 16px;
}

.legend {
  margin-top: 30px;
  padding: 15px;
  background: #f5f7f5;
  border-radius: 8px;
  line-height: 2;
}

.summary {
  margin-top: 30px;
  padding: 20px;
  background: #eef3ee;
  border-radius: 10px;
}

.price {
  font-size: 28px;
  color: #506b59;
  font-weight: bold;
}

.reserve-btn {
  width: 100%;
  padding: 17px;
  margin-top: 20px;
  border: none;
  border-radius: 7px;
  background: #506b59;
  color: white;
  font-size: 18px;
  cursor: pointer;
}

.reserve-btn:disabled {
  background: #aaa;
  cursor: not-allowed;
}

.notice {
  font-size: 13px;
  color: #777;
  line-height: 1.7;
}

#syncStatus {
  text-align: center;
  font-size: 13px;
  padding: 10px;
}

@media(max-width: 600px) {
  main {
    margin: 10px;
    padding: 15px;
  }

  .day {
    min-height: 65px;
  }

  .slots {
    grid-template-columns: repeat(3, 1fr);
  }
}
</style>
</head>

<body>

<header>
  <h1>レンタルサロン yanagi</h1>
  <p>24時間営業・完全予約制</p>
</header>

<main>

<h2>日時を選ぶ</h2>

<p style="text-align:center;">
  OPEN記念価格：1時間500円
</p>

<div id="syncStatus">空き状況を読み込み中...</div>

<div class="month-nav">
  <button onclick="changeMonth(-1)">‹</button>
  <div id="monthTitle"></div>
  <button onclick="changeMonth(1)">›</button>
</div>

<div class="calendar" id="calendar"></div>

<div class="legend">
  <strong>空き状況</strong><br>
  <span class="available">○</span>：空きあり<br>
  <span class="partial">△</span>：一部予約あり<br>
  <span class="unavailable">×</span>：予約不可<br>
  －：受付対象外
</div>

<div class="section">
  <h3 id="dateTitle">利用日を選択してください</h3>
  <p>開始時間を選択</p>
  <div id="slots" class="slots"></div>
</div>

<div class="section">
  <h3>利用時間を選ぶ</h3>
  <select id="duration" onchange="updateSelection()"></select>

  <p class="notice">
    ※30分単位でご利用いただけます。
  </p>
</div>

<div class="summary">
  <div id="selectedDate">利用日：未選択</div>
  <div id="selectedTime">開始時間：未選択</div>
  <div id="selectedDuration">利用時間：未選択</div>
  <div class="price" id="totalPrice">－</div>
</div>

<button class="reserve-btn" disabled>
  予約機能は準備中です
</button>

<p class="notice">
  ※現在は空き状況確認用の試作版です。<br>
  ※予約確定・オンライン決済はまだできません。<br>
  ※日付をまたぐ予約には今後対応予定です。
</p>

</main>

<script>
const API_URL =
  "https://script.google.com/macros/s/AKfycbxVJDFXoq_dOEbScMAXB4u2WOeo6hgj6gC0intPOoictVHHzEaKLjMvkQMP6n7XyWsP/exec";

const calendar = document.getElementById("calendar");
const slots = document.getElementById("slots");
const duration = document.getElementById("duration");
const statusEl = document.getElementById("syncStatus");

let bookings = [];
let loaded = false;

let currentMonth = new Date();
currentMonth.setDate(1);

let selectedDate = null;
let selectedStart = null;

function dateKey(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}

function timeText(minutes) {
  return String(Math.floor(minutes / 60)).padStart(2, "0") +
    ":" + String(minutes % 60).padStart(2, "0");
}

function getDateTime(date, minutes) {
  const [y, m, d] = date.split("-").map(Number);
  return new Date(y, m - 1, d, 0, minutes);
}

function isAvailable(date, start, end) {
  if (!loaded || end > 1440 || end <= start) {
    return false;
  }

  const from = getDateTime(date, start);
  const to = getDateTime(date, end);

  if (from <= new Date()) return false;

  const limit = new Date();
  limit.setDate(limit.getDate() + 90);

  if (to > limit) return false;

  return !bookings.some(b =>
    from < b.end && to > b.start
  );
}

function dayStatus(date) {
  if (!loaded) return "－";

  let free = 0;
  let blocked = 0;

  for (let t = 0; t < 1440; t += 30) {
    if (isAvailable(date, t, t + 30)) {
      free++;
    } else {
      blocked++;
    }
  }

  if (free === 0) return "×";
  if (blocked > 0) return "△";
  return "○";
}

function renderCalendar() {
  calendar.innerHTML = "";

  const year = currentMonth.getFullYear();
  const month = currentMonth.getMonth();

  document.getElementById("monthTitle").textContent =
    `${year}年${month + 1}月`;

  ["日", "月", "火", "水", "木", "金", "土"].forEach(w => {
    const el = document.createElement("div");
    el.className = "weekday";
    el.textContent = w;
    calendar.appendChild(el);
  });

  const first = new Date(year, month, 1).getDay();
  const days = new Date(year, month + 1, 0).getDate();

  for (let i = 0; i < first; i++) {
    calendar.appendChild(document.createElement("div"));
  }

  for (let d = 1; d <= days; d++) {
    const date = dateKey(new Date(year, month, d));
    const symbol = dayStatus(date);

    const button = document.createElement("button");
    button.className = "day";

    if (date === selectedDate) {
      button.classList.add("selected");
    }

    const number = document.createElement("div");
    number.textContent = d;

    const mark = document.createElement("span");
    mark.className = "symbol";
    mark.textContent = symbol;

    if (symbol === "○") mark.classList.add("available");
    if (symbol === "△") mark.classList.add("partial");
    if (symbol === "×") mark.classList.add("unavailable");

    button.appendChild(number);
    button.appendChild(mark);

    if (symbol === "×" || symbol === "－") {
      button.disabled = true;
      button.classList.add("disabled");
    } else {
      button.onclick = () => selectDate(date);
    }

    calendar.appendChild(button);
  }
}

function changeMonth(amount) {
  currentMonth.setMonth(currentMonth.getMonth() + amount);

  selectedDate = null;
  selectedStart = null;

  document.getElementById("dateTitle").textContent =
    "利用日を選択してください";

  renderCalendar();
  renderSlots();
  updateSummary();
}

function selectDate(date) {
  selectedDate = date;
  selectedStart = null;

  document.getElementById("dateTitle").textContent =
    date + " の空き状況";

  renderCalendar();
  renderSlots();
  updateSummary();
}

function renderSlots() {
  slots.innerHTML = "";

  if (!selectedDate) {
    slots.textContent =
      "カレンダーから利用日を選択してください。";
    return;
  }

  const minutes = Number(duration.value);

  for (let t = 0; t < 1440; t += 30) {
    const button = document.createElement("button");
    button.className = "slot";

    const available =
      isAvailable(selectedDate, t, t + minutes);

    button.textContent =
      timeText(t) + (available ? " ○" : " ×");

    if (!available) {
      button.disabled = true;
    } else {
      button.onclick = () => {
        selectedStart = t;
        renderSlots();
        updateSummary();
      };
    }

    if (selectedStart === t && available) {
      button.classList.add("selected");
    }

    slots.appendChild(button);
  }
}

function updateSelection() {
  if (selectedDate && selectedStart !== null) {
    const minutes = Number(duration.value);

    if (!isAvailable(
      selectedDate,
      selectedStart,
      selectedStart + minutes
    )) {
      selectedStart = null;
    }
  }

  renderSlots();
  updateSummary();
}

function updateSummary() {
  document.getElementById("selectedDate").textContent =
    "利用日：" + (selectedDate || "未選択");

  const timeEl = document.getElementById("selectedTime");
  const durationEl = document.getElementById("selectedDuration");
  const priceEl = document.getElementById("totalPrice");

  if (selectedStart === null) {
    timeEl.textContent = "開始時間：未選択";
    durationEl.textContent = "利用時間：未選択";
    priceEl.textContent = "－";
    return;
  }

  const minutes = Number(duration.value);
  const end = selectedStart + minutes;

  timeEl.textContent =
    "利用時間帯：" +
    timeText(selectedStart) + "〜" +
    (end === 1440 ? "24:00" : timeText(end));

  durationEl.textContent =
    "利用時間：" + minutes / 60 + "時間";

  priceEl.textContent =
    (minutes / 60 * 500).toLocaleString("ja-JP") + "円";
}

function yanagiReceiveBookings(data) {
  try {
    if (!data || !Array.isArray(data.reservations)) {
      throw new Error("データ形式が不正です");
    }

    bookings = data.reservations.map(b => ({
      start: new Date(b.start),
      end: new Date(b.end)
    }));

    if (bookings.some(b =>
      !Number.isFinite(b.start.getTime()) ||
      !Number.isFinite(b.end.getTime()) ||
      b.end <= b.start
    )) {
      throw new Error("日時データが不正です");
    }

    loaded = true;

    statusEl.textContent =
      "Googleカレンダーの空き状況を取得しました";

    renderCalendar();
    renderSlots();
    updateSummary();

  } catch (error) {
    syncError();
  }
}

function syncError() {
  loaded = false;
  bookings = [];
  selectedDate = null;
  selectedStart = null;

  statusEl.textContent =
    "空き状況を取得できませんでした。再読み込みしてください。";

  renderCalendar();
  renderSlots();
  updateSummary();
}

function loadBookings() {
  loaded = false;
  statusEl.textContent = "空き状況を読み込み中...";

  const script = document.createElement("script");

  script.src =
    API_URL + "?callback=yanagiReceiveBookings&t=" +
    Date.now();

  script.onerror = syncError;

  document.body.appendChild(script);
}

for (let i = 1; i <= 48; i++) {
  const minutes = i * 30;
  duration.add(new Option(minutes / 60 + "時間", minutes));
}

duration.value = "60";

renderCalendar();
renderSlots();
updateSummary();
loadBookings();

</script>

</body>
</html>
