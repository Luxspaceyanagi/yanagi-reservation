<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>レンタルサロン yanagi｜予約カレンダー</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #f8f7f3;
  color: #333;
  font-family: Arial, sans-serif;
}

header {
  background: #506b59;
  color: white;
  text-align: center;
  padding: 28px 15px;
}

header h1 {
  margin: 0;
  font-size: 25px;
}

header p {
  margin-bottom: 0;
  font-size: 14px;
}

main {
  max-width: 650px;
  margin: 25px auto;
  padding: 25px;
  background: white;
  border-radius: 12px;
}

h2 {
  text-align: center;
  font-size: 22px;
}

.month-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 25px 0;
}

.month-nav button {
  background: none;
  border: none;
  color: #238bd0;
  font-size: 28px;
  cursor: pointer;
}

#monthTitle {
  font-size: 21px;
  font-weight: bold;
}

.calendar {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 5px;
  text-align: center;
}

.weekday {
  padding: 10px 0;
  font-weight: bold;
}

.weekday:first-child { color: red; }
.weekday:nth-child(7) { color: #238bd0; }

.day {
  min-height: 70px;
  padding: 8px 2px;
  border: 1px solid transparent;
  border-radius: 6px;
  cursor: pointer;
  background: white;
}

.day:hover {
  background: #eef6fc;
}

.day.selected {
  background: #dff0ff;
  border-color: #238bd0;
}

.day.disabled {
  color: #bbb;
  cursor: not-allowed;
}

.day .symbol {
  display: block;
  margin-top: 5px;
  color: #238bd0;
  font-size: 23px;
}

.day.disabled .symbol {
  color: #aaa;
}

.section {
  margin-top: 35px;
}

.section h3 {
  font-size: 17px;
}

.time-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

select {
  width: 100%;
  padding: 13px;
  border: 1px solid #ccc;
  border-radius: 5px;
  font-size: 16px;
}

.legend {
  margin-top: 30px;
  padding: 15px;
  background: #f5f7f5;
  border-radius: 8px;
  line-height: 2;
}

.legend span {
  color: #238bd0;
  font-weight: bold;
}

.summary {
  margin-top: 30px;
  padding: 20px;
  background: #eef3ee;
  border-radius: 10px;
}

.price {
  font-size: 28px;
  color: #506b59;
  font-weight: bold;
}

.reserve-btn {
  width: 100%;
  padding: 17px;
  margin-top: 20px;
  border: none;
  border-radius: 7px;
  background: #506b59;
  color: white;
  font-size: 18px;
  cursor: pointer;
}

.notice {
  font-size: 13px;
  color: #777;
  line-height: 1.7;
}

@media(max-width: 600px) {
  main {
    margin: 10px;
    padding: 15px;
  }

  .day {
    min-height: 65px;
  }

  .time-row {
    gap: 5px;
  }

  select {
    padding: 10px 3px;
    font-size: 14px;
  }
}
</style>
</head>

<body>

<header>
  <h1>レンタルサロン yanagi</h1>
  <p>24時間営業・完全予約制</p>
</header>

<main>

<h2>日時を選ぶ</h2>

<p style="text-align:center;">
  OPEN記念価格：1時間500円
</p>

<div class="month-nav">
  <button onclick="changeMonth(-1)">‹</button>
  <div id="monthTitle"></div>
  <button onclick="changeMonth(1)">›</button>
</div>

<div class="calendar" id="calendar"></div>

<div class="section">
  <h3>利用時間を選ぶ</h3>

  <div class="time-row">
    <select id="startTime"></select>
    <span>→</span>
    <select id="endTime"></select>
  </div>

  <p class="notice">
    ※30分単位でご利用いただけます。
  </p>
</div>

<div class="legend">
  <strong>空き状況</strong><br>
  <span>○</span>：選択可能<br>
  <span>－</span>：選択不可
  <p class="notice">
    ※現在は試作版です。実際の予約状況は反映されていません。
  </p>
</div>

<div class="summary">
  <div id="selectedDate">利用日を選択してください</div>
  <div id="selectedTime"></div>
  <div class="price" id="totalPrice">500円</div>
</div>

<button class="reserve-btn" onclick="confirmReservation()">
  予約内容を確認する
</button>

<p class="notice">
  ※現在は試作段階です。予約確定・決済はできません。
</p>

</main>

<script>
const calendar = document.getElementById("calendar");
const monthTitle = document.getElementById("monthTitle");
const startTime = document.getElementById("startTime");
const endTime = document.getElementById("endTime");

let currentDate = new Date();
currentDate.setDate(1);

let selectedDate = null;

function formatDate(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}

function renderCalendar() {
  calendar.innerHTML = "";

  const year = currentDate.getFullYear();
  const month = currentDate.getMonth();

  monthTitle.textContent = `${year}年${month + 1}月`;

  const weekdays = ["日", "月", "火", "水", "木", "金", "土"];

  weekdays.forEach(day => {
    const div = document.createElement("div");
    div.className = "weekday";
    div.textContent = day;
    calendar.appendChild(div);
  });

  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  for (let i = 0; i < firstDay; i++) {
    calendar.appendChild(document.createElement("div"));
  }

  const today = new Date();
  today.setHours(0, 0, 0, 0);

  for (let day = 1; day <= daysInMonth; day++) {
    const date = new Date(year, month, day);
    const dateString = formatDate(date);

    const button = document.createElement("button");
    button.className = "day";

    const disabled = date < today;

    if (disabled) {
      button.classList.add("disabled");
      button.disabled = true;
    }

    if (selectedDate === dateString) {
      button.classList.add("selected");
    }

    button.innerHTML = `
      ${day}
      <span class="symbol">${disabled ? "－" : "○"}</span>
    `;

    button.onclick = () => {
      selectedDate = dateString;
      renderCalendar();
      updateSummary();
    };

    calendar.appendChild(button);
  }
}

function changeMonth(amount) {
  currentDate.setMonth(currentDate.getMonth() + amount);
  renderCalendar();
}

function createTimeOptions() {
  for (let h = 0; h < 24; h++) {
    for (let m of [0, 30]) {
      const time =
        String(h).padStart(2, "0") + ":" +
        String(m).padStart(2, "0");

      startTime.add(new Option(time, h * 60 + m));
      endTime.add(new Option(time, h * 60 + m));
    }
  }

  endTime.add(new Option("翌日 00:00", 1440));

  startTime.value = "720";
  endTime.value = "780";
}

function updateSummary() {
  const start = Number(startTime.value);
  const end = Number(endTime.value);

  const minutes = end - start;

  const dateText = document.getElementById("selectedDate");
  const timeText = document.getElementById("selectedTime");
  const priceText = document.getElementById("totalPrice");

  if (selectedDate) {
    dateText.textContent = `利用日：${selectedDate}`;
  } else {
    dateText.textContent = "利用日を選択してください";
  }

  if (minutes <= 0) {
    timeText.textContent = "終了時間を開始時間より後にしてください";
    priceText.textContent = "－";
    return;
  }

  const hours = minutes / 60;
  const price = hours * 500;

  timeText.textContent =
    `利用時間：${hours}時間`;

  priceText.textContent =
    price.toLocaleString("ja-JP") + "円";
}

function confirmReservation() {
  if (!selectedDate) {
    alert("利用日を選択してください。");
    return;
  }

  const start = Number(startTime.value);
  const end = Number(endTime.value);

  if (end <= start) {
    alert("終了時間を開始時間より後にしてください。");
    return;
  }

  const [y, m, d] = selectedDate.split("-").map(Number);
  const selectedStart = new Date(y, m - 1, d);
  selectedStart.setMinutes(start);

  if (selectedStart <= new Date()) {
    alert("未来の日時を選択してください。");
    return;
  }

  const price = (end - start) / 60 * 500;

  alert(
    "【予約内容の確認】\n\n" +
    "利用日：" + selectedDate + "\n" +
    "開始時間：" + startTime.selectedOptions[0].text + "\n" +
    "終了時間：" + endTime.selectedOptions[0].text + "\n" +
    "料金：" + price + "円\n\n" +
    "※現在は試作版のため予約は確定しません。"
  );
}

startTime.addEventListener("change", updateSummary);
endTime.addEventListener("change", updateSummary);

createTimeOptions();
renderCalendar();
updateSummary();
</script>

</body>
</html>
