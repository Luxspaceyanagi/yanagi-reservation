<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>レンタルサロン yanagi | ご予約</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #f7f5ef;
  color: #333;
  font-family: sans-serif;
}
header {
  background: #526b56;
  color: white;
  text-align: center;
  padding: 35px 15px;
}
header h1 { margin: 0; font-size: 27px; }
header p { margin-bottom: 0; }
main {
  max-width: 560px;
  margin: 30px auto;
  padding: 25px;
  background: white;
  border-radius: 15px;
}
h2 { color: #526b56; font-size: 20px; }
label { display: block; margin-top: 20px; }
input, select, button {
  width: 100%;
  padding: 13px;
  margin-top: 8px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 16px;
}
.price {
  margin-top: 25px;
  padding: 20px;
  background: #f1f5ef;
  text-align: center;
  border-radius: 10px;
}
.price strong {
  font-size: 30px;
  color: #526b56;
}
button {
  background: #526b56;
  color: white;
  border: none;
  margin-top: 25px;
  cursor: pointer;
}
.note { font-size: 12px; color: #777; }
</style>
</head>
<body>

<header>
  <h1>レンタルサロン yanagi</h1>
  <p>24時間営業・完全予約制</p>
</header>

<main>
  <h2>ご予約フォーム</h2>
  <p>OPEN記念価格：1時間 500円</p>

  <label>ご利用日
    <input type="date" id="date">
  </label>

  <label>開始時間
    <select id="start"></select>
  </label>

  <label>ご利用時間
    <select id="duration"></select>
  </label>

  <div class="price">
    お支払い予定金額<br>
    <strong id="total">500円</strong>
  </div>

  <label>お名前
    <input type="text" id="name" autocomplete="name">
  </label>

  <label>メールアドレス
    <input type="email" id="email" autocomplete="email">
  </label>

  <button type="button" onclick="preview()">
    予約内容を確認する
  </button>

  <p class="note">
    ※現在は予約ページの試作段階です。
    予約確定・オンライン決済はまだできません。
  </p>
</main>

<script>
const start = document.getElementById("start");
const duration = document.getElementById("duration");
const total = document.getElementById("total");
const date = document.getElementById("date");

const today = new Date();
const yyyy = today.getFullYear();
const mm = String(today.getMonth() + 1).padStart(2, "0");
const dd = String(today.getDate()).padStart(2, "0");
date.min = `${yyyy}-${mm}-${dd}`;

for (let h = 0; h < 24; h++) {
  for (let m of [0, 30]) {
    const time =
      String(h).padStart(2, "0") + ":" +
      String(m).padStart(2, "0");
    start.add(new Option(time, time));
  }
}

for (let i = 1; i <= 48; i++) {
  const minutes = i * 30;
  const hours = minutes / 60;
  duration.add(new Option(hours + "時間", minutes));
}

duration.value = "60";

function updatePrice() {
  const minutes = Number(duration.value);
  const price = minutes / 60 * 500;
  total.textContent = price.toLocaleString("ja-JP") + "円";
}

duration.addEventListener("change", updatePrice);

function preview() {
  const selectedDate = date.value;
  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();

  if (!selectedDate || !name || !email) {
    alert("日付・お名前・メールアドレスを入力してください。");
    return;
  }

  const selected = new Date(selectedDate + "T" + start.value);
  if (selected <= new Date()) {
    alert("未来の日時を選択してください。");
    return;
  }

  if (!document.getElementById("email").checkValidity()) {
    alert("正しいメールアドレスを入力してください。");
    return;
  }

  alert(
    "【予約内容の確認】\n\n" +
    "ご利用日：" + selectedDate + "\n" +
    "開始時間：" + start.value + "\n" +
    "利用時間：" + Number(duration.value) / 60 + "時間\n" +
    "料金：" + total.textContent + "\n\n" +
    "※これは確認用です。予約はまだ確定しません。"
  );
}

updatePrice();
</script>
</body>
</html>
